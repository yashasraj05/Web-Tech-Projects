<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<form>
<fieldset>

<table>
<tr>
    <td >FullName</td>
    <td>
        <input type="text" maxlength="20" required>
        
    </td>
</tr>

<tr>
    <td>Lastname</td>
    <td>
        <input type="text" maxlength="20" required>
       
    </td>
</tr>

<tr>
    <td>Date of Birth</td>
    <td>
        <input type="date" name="dob" required>
    </td>
</tr>

<tr>
    <td>GENDER</td>
    <td>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
    </td>
</tr>

<tr>
    <td>EMAIL ID</td>
    <td><input type="email"></td>
</tr>

<tr>
    <td>MOBILE NO</td>
    <td><input type="tel" maxlength="10"></td>
</tr>

<tr>
    <td>ADDRESS</td>
    <td>
        <textarea rows="8" cols="25"></textarea>
    </td>
</tr>

<tr>
    <td>CITY</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>PINCODE</td>
    <td>
        <input type="text" maxlength="6">
    </td>
</tr>

<tr>
    <td>EMAIL ID</td>
    <td><input type="email"></td>
</tr>

<tr>
    <td>STATE</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>COUNTRY</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>HOBBIES</td>
    <td>
        <input type="checkbox">Drawing
        <input type="checkbox">Singing
        <input type="checkbox">Dancing
        <br>
        <input type="checkbox">Other
        <input type="text">
    </td>
</tr>

<tr>
    <td>Qualification</td>
    <td>
        <table>
            <tr>
                <td>Sl.No</td>
                <td>Examination</td>
                <td>Board</td>
                <td>Percentage</td>
                <td>Year of pass</td>
            </tr>

            <tr>
                <td>01</td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
            </tr>

            <tr>
                <td>02</td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
            </tr>

            <tr>
                <td>03</td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
            </tr>

            <tr>
                <td>04</td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
                <td><input type="text" size="15"></td>
            </tr>
        </table>
    </td>
</tr>

<tr>
    <td>COURSES<br>APPLIED<br>FOR</td>
    <td>
        <input type="checkbox">BCA
        <input type="checkbox">B.com
        <input type="checkbox">B.sc
        <input type="checkbox">B.A
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="submit">
        <input type="reset" value="reset">
    </td>
</tr>

</table>

</fieldset>
</form>

</body>
</html>
